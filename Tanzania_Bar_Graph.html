<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tanzania Land Cover — Bar Graph for QGIS</title>
<style>
/* QGIS Layout > Add HTML: load this file or paste the complete code into Source.
   Suggested frame: 112 x 150 mm. Disable the item's Background and Frame.
   No Internet or JavaScript needed. Barlow is used if installed.
   Values are static and supplied by the user, not calculated from a QGIS layer.
   Bar width = value / 50 * 190 SVG units. Axis is 0–50 percent.
   Snow/Ice uses 0.005% solely as a plotting placeholder for <0.01%.
   All exact labels are preserved, with no minimum bar width applied. */
html,body {margin:0;padding:0;background:transparent !important;}
body {font-family:'Barlow','Segoe UI',Arial,sans-serif;font-weight:400;color:#243e34;}
.legend {width:100%;max-width:420px;}
h2 {margin:0 0 6px;font-size:22px;line-height:28px;font-weight:600;}
.subtitle {margin:0 0 16px;color:#65776f;font-size:13px;line-height:18px;}
svg {display:block;width:100%;height:auto;}
.note {margin:12px 0 0;color:#65776f;font-size:11px;line-height:16px;}
</style>
</head>
<body><div class="legend">
<h2>Land cover</h2>
<p class="subtitle">Tanzania · share of classified area</p>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 438" width="420" height="438" role="img" aria-labelledby="chart-title chart-description">
<title id="chart-title">Tanzania land cover bar graph</title>
<desc id="chart-description">One horizontal bar per land cover class. Bar lengths use a common zero to fifty percent scale. Snow and ice are less than 0.01 percent.</desc>
<g font-family="Barlow, Segoe UI, Arial, sans-serif" font-size="13" fill="#243e34">
<line x1="155.0" y1="12" x2="155.0" y2="382" stroke="#dfe6e1" stroke-width="0.7"/>
<text x="155.0" y="402" text-anchor="middle" fill="#65776f" font-size="11">0</text>

<text x="193.0" y="402" text-anchor="middle" fill="#65776f" font-size="11">10</text>
<line x1="231.0" y1="12" x2="231.0" y2="382" stroke="#dfe6e1" stroke-width="0.7"/>
<text x="231.0" y="402" text-anchor="middle" fill="#65776f" font-size="11">20</text>
<line x1="269.0" y1="12" x2="269.0" y2="382" stroke="#dfe6e1" stroke-width="0.7"/>
<text x="269.0" y="402" text-anchor="middle" fill="#65776f" font-size="11">30</text>
<line x1="307.0" y1="12" x2="307.0" y2="382" stroke="#dfe6e1" stroke-width="0.7"/>
<text x="307.0" y="402" text-anchor="middle" fill="#65776f" font-size="11">40</text>
<line x1="345.0" y1="12" x2="345.0" y2="382" stroke="#dfe6e1" stroke-width="0.7"/>
<text x="345.0" y="402" text-anchor="middle" fill="#65776f" font-size="11">50</text>
<rect x="0" y="24" width="10" height="10" fill="#358221" stroke="#b7c5bb" stroke-width=".5"/>
<text x="18" y="34">Trees</text>
<rect x="155" y="20" width="129.9220" height="23" fill="#358221"><title>Trees: 34.19%</title></rect>
<text x="412" y="35" text-anchor="end" fill="#65776f">34.19%</text>
<rect x="0" y="64" width="10" height="10" fill="#eecfa8" stroke="#b7c5bb" stroke-width=".5"/>

<text x="250" y="429" text-anchor="middle" fill="#65776f" font-size="12">Share of classified area (%)</text>
</g></svg>
<p class="note">Static reference values. Tiny bars may be difficult to see at this scale. Snow/Ice is &lt;0.01%; its bar uses a 0.005% plotting placeholder.</p>
</div></body>
</html>
